version: "3.8"

services:
  backend:
    build: .
    container_name: chat-backend
    expose:
      - "8000"
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    restart: always